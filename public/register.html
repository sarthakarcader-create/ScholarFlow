
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | ScholarFlow</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 35px 18px;
            background: radial-gradient(circle at top right, #e9e6ff, #f8f9fd 55%);
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            border: 1px solid #e8eaf2;
            border-radius: 22px;
            background: white;
            box-shadow: 0 20px 60px #24205a12;
        }

        .auth-card h1 {
            margin: 25px 0 8px;
            font-family: 'Manrope', sans-serif;
            font-size: 29px;
            letter-spacing: -1px;
        }

        .auth-subtitle {
            margin-bottom: 28px;
            color: #788198;
            font-size: 14px;
            line-height: 1.7;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dfe3ee;
            border-radius: 10px;
            outline: none;
            font: inherit;
            font-size: 14px;
        }

        .field input:focus {
            border-color: #5546e8;
            box-shadow: 0 0 0 3px #5546e815;
        }

        .auth-submit {
            width: 100%;
            margin-top: 7px;
        }

        .auth-message {
            margin-top: 17px;
            font-size: 13px;
            line-height: 1.6;
        }

        .auth-bottom {
            margin-top: 23px;
            text-align: center;
            color: #788198;
            font-size: 13px;
        }

        .auth-bottom a {
            color: #5546e8;
            font-weight: 700;
        }

        .approval-note {
            margin-top: 20px;
            padding: 13px;
            border-radius: 10px;
            background: #f5f4ff;
            color: #5b54a3;
            font-size: 12px;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="brand" href="/">
                <span class="brand-icon">S</span>
                <span>ScholarFlow</span>
            </a>

            <h1>Create your account</h1>
            <p class="auth-subtitle">
                Join ScholarFlow to discover scholarships and track your applications.
            </p>

            <form id="registerForm">
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" name="name" type="text"
                           autocomplete="name" maxlength="100" required>
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email"
                           autocomplete="email" maxlength="150" required>
                </div>

                <div class="field">
                    <label for="institute">Institute / College</label>
                    <input id="institute" name="institute" type="text"
                           maxlength="150" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password"
                           autocomplete="new-password" minlength="8"
                           maxlength="72" required>
                </div>

                <button class="button primary auth-submit" type="submit">
                    Submit registration →
                </button>

                <p id="registerMessage" class="auth-message" role="status"></p>
            </form>

            <div class="approval-note">
                <strong>Account approval required</strong><br>
                After registering, an administrator must approve your account
                before you can sign in.
            </div>

            <div class="auth-bottom">
                Already registered? <a href="/login.html">Sign in</a>
            </div>
        </section>
    </main>

    <script src="/js/register.js" defer></script>
</body>
</html>
