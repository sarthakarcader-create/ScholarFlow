
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | ScholarFlow</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top right, #e9e6ff, #f8f9fd 55%);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid #e8eaf2;
            border-radius: 22px;
            background: white;
            box-shadow: 0 20px 60px #24205a12;
        }

        .auth-card h1 {
            margin: 28px 0 8px;
            font-family: 'Manrope', sans-serif;
            font-size: 30px;
            letter-spacing: -1px;
        }

        .auth-subtitle {
            margin-bottom: 28px;
            color: #788198;
            font-size: 14px;
            line-height: 1.7;
        }

        .field {
            margin-bottom: 19px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dfe3ee;
            border-radius: 10px;
            outline: none;
            font: inherit;
            font-size: 14px;
        }

        .field input:focus {
            border-color: #5546e8;
            box-shadow: 0 0 0 3px #5546e815;
        }

        .auth-submit {
            width: 100%;
            margin-top: 5px;
        }

        .auth-message {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.6;
        }

        .auth-bottom {
            margin-top: 25px;
            text-align: center;
            color: #788198;
            font-size: 13px;
        }

        .auth-bottom a {
            color: #5546e8;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="brand" href="/">
                <span class="brand-icon">S</span>
                <span>ScholarFlow</span>
            </a>

            <h1>Welcome back.</h1>
            <p class="auth-subtitle">
                Sign in to continue to your scholarship workspace.
            </p>

            <form id="loginForm">
                <div class="field">
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        type="email"
                        autocomplete="username"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="button primary auth-submit" type="submit">
                    Sign in securely →
                </button>

                <p id="loginMessage" class="auth-message" role="status"></p>
            </form>

            <div class="auth-bottom">
                New to ScholarFlow? <a href="/register.html">Create an account</a>
            </div>
        </section>
    </main>

    <script src="/js/login.js" defer></script>
</body>
</html>
